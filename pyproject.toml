[project]
name = "cloudagentperform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111", "uvicorn>=0.30", "redis>=5.0", "httpx>=0.27", "docker>=7.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.2"]
[tool.setuptools]
packages = ["core", "sandbox", "agent", "worker", "api", "cli"]
[tool.pytest.ini_options]
testpaths = ["tests"]
